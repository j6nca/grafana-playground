name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if env files or private keys are tracked (matches file names, not contents).
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$'; then
            echo "::error::Sensitive files are committed"
            exit 1
          fi

      - name: Validate YAML files
        run: |
          status=0
          for f in $(git ls-files '*.yml' '*.yaml'); do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::Invalid YAML"; status=1; }
          done
          exit $status

      - name: Validate dashboards
        shell: python
        run: |
          import json, pathlib, sys

          uids, ok = {}, True
          for path in sorted(pathlib.Path("dashboards").rglob("*.json")):
              if path.name == "_folder.json":  # Git Sync folder metadata, not a dashboard
                  continue
              try:
                  dash = json.loads(path.read_text())
              except json.JSONDecodeError as e:
                  print(f"::error file={path}::Invalid JSON: {e}")
                  ok = False
                  continue
              for key in ("uid", "title"):
                  if not dash.get(key):
                      print(f"::error file={path}::Missing '{key}'")
                      ok = False
              uid = dash.get("uid")
              if uid in uids:
                  print(f"::error file={path}::Duplicate uid '{uid}' (also in {uids[uid]})")
                  ok = False
              elif uid:
                  uids[uid] = path
          print(f"Checked {len(uids)} dashboard(s)")
          sys.exit(0 if ok else 1)
